<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Outer green circle -->
  <circle cx="110" cy="110" r="90" fill="#0a9444" />

  <!-- Inner light ring -->
  <circle cx="110" cy="110" r="55" fill="white" />

  <!-- Inner grey circle -->
  <circle cx="110" cy="110" r="35" fill="#5f6368" />

  <!-- Handle (approximation) -->
